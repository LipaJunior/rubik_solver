spring.application.name=rubik_solver
logging.level.com.smse.rubik_solver.service=DEBUG

# Port: platformy hostingowe (Render/Railway/Heroku itp.) podaja go przez zmienna PORT,
# lokalnie domyslnie 8080.
server.port=${PORT:8080}

# Statyka (JS/CSS/HTML): kaz przegladarce rewalidowac przed uzyciem cache, zeby po
# kazdym deployu pobierala swieze pliki (unika mieszania starego JS z nowym HTML).
spring.web.resources.cache.cachecontrol.no-cache=true

# Baza danych: lokalnie domyslnie H2 in-memory (zero konfiguracji, dane znikaja po
# restarcie - OK do nauki). Na produkcji ustaw DB_URL/DB_USER/DB_PASS (np. Postgres),
# a Spring wykryje sterownik po URL-u. Zadne haslo w kodzie/gicie.
spring.datasource.url=${DB_URL:jdbc:h2:mem:cubedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logowanie Google (OAuth2). Ustaw GOOGLE_CLIENT_ID i GOOGLE_CLIENT_SECRET w env
# (NIE w kodzie/gicie). Domyslne placeholdery pozwalaja aplikacji wystartowac bez
# nich, ale logowanie zadziala dopiero po podaniu prawdziwych wartosci.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

springdoc.swagger-ui.enabled=true


springdoc.api-docs.title=Rubik's Cube Solver API

springdoc.api-docs.description=API for solving Rubik's Cube step by step.


# Konfiguracja Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha